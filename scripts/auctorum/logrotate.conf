# Auctorum logrotate config — install at /etc/logrotate.d/kee-worker
#
#   sudo cp logrotate.conf /etc/logrotate.d/kee-worker
#
# Daily rotation, 7-day retention, gzip after the first day.
# Already installed by night sweep; this file is the reproducible source.

/opt/keewarm/warm.log
/var/lib/chromadb/chroma.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 cocopsn cocopsn
}
